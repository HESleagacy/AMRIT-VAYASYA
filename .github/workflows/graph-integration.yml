name: Graph integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  neo4j:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.18-community
        env:
          NEO4J_AUTH: neo4j/test-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest integration/ -q
        working-directory: cross-repo
        env:
          VAYASYA_TEST_NEO4J_URI: bolt://localhost:7687
